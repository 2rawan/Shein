<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1ea" />
    <meta
      name="description"
      content="Nova — considered wardrobe essentials, made in small runs. Outerwear, dresses, knitwear, shoes and accessories."
    />
    <title>Nova — Considered wardrobe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400..600&display=swap"
    />
    <script>
      // Apply the saved language before first paint to avoid an LTR/RTL flash.
      try {
        var saved = JSON.parse(localStorage.getItem("nova:preferences") || "{}");
        if (saved.state && saved.state.locale === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
